name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # build-apps.js writes apps/<slug>/ pages (and a basic sitemap);
      # build-sitemap.mjs then writes the full sitemap including those pages.
      - name: Generate app pages & sitemap
        run: |
          node scripts/build-apps.js
          node tools/build-sitemap.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Publish only website files. docs/, tools/, partials/, .github/ and
      # brand-kit source images in the repo root are intentionally excluded.
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp *.html _site/
          rm -f _site/admin.html   # local-only editor, never published
          cp works.json robots.txt sitemap.xml CNAME .nojekyll favicon.ico _site/
          cp styles.css icon.png daril.jpg _site/
          cp -r css js assets apps AppStoreScreenshots _site/
          test -f cv.pdf && cp cv.pdf _site/ || true
          echo "Published files:" && find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
